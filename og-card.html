<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; width: 1200px; height: 630px; background: #44452E; color: #F2EEE3; overflow: hidden; }
    .card { align-items: flex-start; width: 1200px; height: 630px; box-sizing: border-box; padding: 0 90px; display: flex; flex-direction: column; justify-content: center; }
    .hello { font: 400 52px/1 "Pinyon Script", cursive; }
    h1 { margin: 22px 0 0; font: 500 112px/1.05 "Cormorant Garamond", Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .sub { margin-top: 26px; font: 600 30px "Manrope", Arial, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap; }
    hr { border: 0; border-top: 1px solid #F2EEE3; margin: 44px 0 30px; width: 1020px; }
    .tag { font: 400 44px/1.2 "Pinyon Script", cursive; }
</style>
</head>
<body>
<div class="card">
    <div class="hello">Hello, I'm</div>
    <h1 id="n">Shane Ranet Basilio</h1>
    <div class="sub" id="s">BSIT | Batangas State University</div>
    <hr>
    <div class="tag">Learning, exploring, and making meaningful memories</div>
</div>
<script>
Promise.all([document.fonts.load('500 40px "Cormorant Garamond"'), document.fonts.load('40px "Pinyon Script"'), document.fonts.load('600 12px "Manrope"')]).then(function () {
    var n = document.getElementById("n"), s = document.getElementById("s");
    n.style.display = "inline-block";
    var W = 1020, sp = parseFloat(getComputedStyle(n).letterSpacing);
    var w = n.getBoundingClientRect().width - sp;
    n.style.fontSize = (112 * W / w) + "px";
    s.style.display = "inline-block"; s.style.letterSpacing = "0px";
    var base = s.getBoundingClientRect().width;
    s.style.letterSpacing = ((W - base) / s.textContent.length) + "px";
});
</script>
</body>
</html>
